name: Build

on:
  push:
    branches: [master, roothide-ios27]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roothide:
    name: RootHide (arm64e)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$XCODE" ] || { echo "Xcode 26 not found on runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -switch "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: brew install make ldid xz dpkg

      - name: Install RootHide Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect package
        run: |
          for deb in Releases/*roothide*.deb Releases/*arm64e*.deb; do
            [ -f "$deb" ] || continue
            echo "== $deb"
            dpkg-deb -I "$deb" | grep -E "Package|Version|Architecture"
            dpkg-deb -c "$deb"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tweaksettings-roothide-arm64e
          path: Releases/*arm64e*.deb
          if-no-files-found: error
